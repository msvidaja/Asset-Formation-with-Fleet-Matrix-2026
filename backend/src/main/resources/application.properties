spring.application.name=asset
server.port=${SERVER_PORT:8080}

# --- PostgreSQL datasource (override via env vars) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assetflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# In production, always override app.jwt.secret with a long random value via env.
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-long!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (frontend origin) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
