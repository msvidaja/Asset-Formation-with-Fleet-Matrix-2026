# H2 in-memory DB for tests (PostgreSQL compatibility mode) so the
# Spring context loads without a live PostgreSQL server.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-that-is-definitely-long-enough-for-hmac-sha256!!
app.jwt.expiration-ms=3600000
